[package]
name = "historia"
version = "0.1.0"
edition = "2021"
# MSRV: pinned to the stable toolchain this checkpoint was built and tested with
# (rustc 1.97.1, installed via rustup on 2026-08-12). Bump deliberately, not by accident.
rust-version = "1.97.1"
authors = ["Leo Tamminen"]
license = "MIT"
description = "Minimal, git-style version control for backing up one folder."
readme = "README.md"

[dependencies]
# clap: derive-free "builder" API used to construct the command list straight from the
# `cli::COMMANDS` registry (one source of truth for parsing, --help, and our own `help`
# command; CLAUDE.md §8). Also gives non-interactive-friendly --version/--help handling
# and clean exit codes for free (§6). Pinned to the 4.x line, the current stable series.
clap = "4"
# sha2: content hashing (CLAUDE.md §7). Blobs are content-addressed by SHA-256, and
# streamed in fixed-size chunks (never read whole into memory - Rule 11).
sha2 = "0.10"
# serde/serde_json: manifest read/write as JSON (CLAUDE.md §7) - human-readable and
# recoverable by hand even without this binary. No chrono/time crate added: the
# manifest's ISO-8601 UTC timestamp is produced by a small hand-rolled civil-calendar
# conversion in format/manifest.rs (Howard Hinnant's public-domain days<->date
# algorithm) built on std::time alone, since UTC-only formatting doesn't need a full
# timezone-aware date library (Rule 9: minimal dependencies).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ignore: gitignore-syntax matching for `.historiaignore` (CLAUDE.md §7 - ripgrep's
# own matcher, earmarked for exactly this). Pinned to the 0.4 line, the current
# stable series (also what ripgrep itself depends on).
ignore = "0.4"
# hostname: `motd`'s "Host:" line (CLAUDE.md CP12) needs the local machine's
# hostname, which std has no portable API for. This crate does nothing but wrap
# the local gethostname()/GetComputerNameExW() syscall per platform - no
# network, no I/O beyond that one local call (Rule 2 stays satisfied). Picked
# over rolling our own per-platform FFI because it keeps this codebase at zero
# unsafe code (Rule 9's minimalism cuts both ways: prefer a tiny, focused,
# already-audited crate here over hand-written unsafe syscall bindings).
hostname = "0.4"

[dev-dependencies]
# assert_cmd/predicates: drive the compiled binary as a subprocess and assert on its
# stdout/exit code, for the CP0 smoke test (tests/smoke.rs). Dev-only, never shipped.
assert_cmd = "2"
predicates = "3"
# tempfile: isolated scratch directories for init/store tests (CP1), so tests never
# touch the real filesystem outside a temp dir. Dev-only, never shipped.
tempfile = "3"

[profile.release]
# opt-level 3 (speed) over "z" (size): historia's release-critical work is streaming
# hashing/copying of file content in later checkpoints (Rule 11), where runtime matters
# more than shaving a few hundred KB off a CLI binary that already has few dependencies.
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
