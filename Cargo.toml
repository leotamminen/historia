[package]
name = "historia"
version = "0.1.0"
edition = "2021"
# MSRV: pinned to the stable toolchain this checkpoint was built and tested with
# (rustc 1.97.1, installed via rustup on 2026-08-12). Bump deliberately, not by accident.
rust-version = "1.97.1"
authors = ["Leo Tamminen"]
license = "MIT"
description = "Minimal, git-style version control for backing up one folder."
readme = "README.md"

[dependencies]
# clap: derive-free "builder" API used to construct the command list straight from the
# `cli::COMMANDS` registry (one source of truth for parsing, --help, and our own `help`
# command; CLAUDE.md §8). Also gives non-interactive-friendly --version/--help handling
# and clean exit codes for free (§6). Pinned to the 4.x line, the current stable series.
clap = "4"

[dev-dependencies]
# assert_cmd/predicates: drive the compiled binary as a subprocess and assert on its
# stdout/exit code, for the CP0 smoke test (tests/smoke.rs). Dev-only, never shipped.
assert_cmd = "2"
predicates = "3"

[profile.release]
# opt-level 3 (speed) over "z" (size): historia's release-critical work is streaming
# hashing/copying of file content in later checkpoints (Rule 11), where runtime matters
# more than shaving a few hundred KB off a CLI binary that already has few dependencies.
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
