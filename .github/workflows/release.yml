# Build historia for six platforms and publish the binaries to a GitHub Release
# whenever a `v*` tag is pushed (CLAUDE.md CP10). The author pushes the tag by
# hand (Rule 1 - Claude Code never commits/pushes/tags); this workflow only
# reacts to that push.
#
# Two jobs, in sequence:
#   1. create-release - creates the GitHub Release for the tag once, so the six
#      parallel build jobs below never race each other trying to create it.
#   2. build           - a 6-entry matrix (one per target triple), each of which
#      compiles historia in release mode, packages the binary with LICENSE and
#      README.md into a single archive, and uploads that archive as an asset on
#      the release created in step 1.
#
# Every step uses either an official GitHub action (actions/checkout), the
# `dtolnay/rust-toolchain` action (small, widely used across the Rust ecosystem
# specifically for CI toolchain setup), or tooling already preinstalled on every
# GitHub-hosted runner (`gh`, `tar`, PowerShell's `Compress-Archive`). No
# third-party release/upload action and no secret beyond the automatically
# provided `GITHUB_TOKEN` (Rule 9-adjacent: minimal external dependencies
# extends to CI, not just Cargo.toml).

name: Release

on:
  push:
    tags:
      - "v*"

# Least-privilege default; the two jobs below opt into `contents: write`
# explicitly, since that's the only permission creating a release / uploading
# an asset actually needs.
permissions:
  contents: read

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # Idempotent: safe to re-run this workflow (e.g. after a build-job
      # failure) without erroring on "release already exists".
      - name: Create release (if it doesn't already exist)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $tag already exists - reusing it."
          else
            gh release create "$tag" \
              --repo "${{ github.repository }}" \
              --title "historia $tag" \
              --notes-file .github/release-notes-template.md
          fi

  build:
    name: Build (${{ matrix.target }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      # Let every target finish (and upload what it can) even if one fails,
      # rather than cancelling the other five mid-build.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          # Cross-compiled from the same x86_64 Windows runner: the ARM64 MSVC
          # linker/libs ship as part of the VS2022 Build Tools already
          # installed on GitHub's windows-latest image, so this needs nothing
          # beyond `rustup target add`. This is the one target in the matrix
          # not independently verified on real hardware by this change - flag
          # it if the release workflow's first real run shows otherwise.
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          # macos-14 is an Apple Silicon (arm64) runner. Both macOS targets are
          # built from this single host: Xcode's toolchain has cross-compiled
          # x86_64 <-> arm64 natively since the Apple Silicon transition, so
          # `x86_64-apple-darwin` doesn't need a second (Intel) runner.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Cross-compiled via the apt-installed aarch64 gcc/linker (below).
          # historia has zero C dependencies (pure-Rust crate tree - see
          # Cargo.toml), so a plain cross-linker is enough; no need for the
          # heavier `cross` (Docker-based) tool.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install aarch64 Linux cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      # --locked: build exactly what Cargo.lock (committed) resolved, the same
      # dependency graph as everywhere else, not whatever `cargo update` would
      # newly resolve on release day.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Windows CRT is statically linked via .cargo/config.toml's
      # target-scoped `+crt-static` (CP0/CP10) - this .exe has no external DLL
      # dependency. Packaged with PowerShell's built-in Compress-Archive, no
      # extra tool needed (7-Zip is also preinstalled on this image, but the
      # native cmdlet is simpler and needs no argument-quoting gymnastics).
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart('v')
          $stage = "historia-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/historia.exe" $stage/
          Copy-Item LICENSE, README.md $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "$stage.zip"
          echo "ASSET=$stage.zip" >> $env:GITHUB_ENV

      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          stage="historia-${version}-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/historia" "$stage/"
          cp LICENSE README.md "$stage/"
          tar -czf "${stage}.tar.gz" -C "$stage" .
          echo "ASSET=${stage}.tar.gz" >> "$GITHUB_ENV"

      # --clobber: safe to re-run a single failed matrix job without first
      # deleting its previous (partial or stale) asset by hand.
      #
      # Single line, deliberately: this step has no explicit `shell:`, so it
      # runs under bash on Linux/macOS but PowerShell on Windows (GitHub
      # Actions' per-OS default). A trailing `\` line continuation is a
      # bash-ism that PowerShell doesn't understand, which broke this exact
      # step on Windows before (CP10 fix). One line has no continuation syntax
      # to get wrong, so it's correct under either shell without needing to
      # pin one.
      - name: Upload asset to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" "${{ env.ASSET }}" --repo "${{ github.repository }}" --clobber
