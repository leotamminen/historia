# Scoped to the Windows MSVC targets only: statically link the CRT so the release
# .exe has no external DLL dependency (install = copy one file, per CLAUDE.md CP10).
# Must NOT affect other targets/hosts (e.g. this repo's Linux/macOS dev and CP10
# release builds) - hence per-[target.<triple>] scoping instead of a blanket
# [build] rustflags. Both Windows release targets (CP10: x86_64 and aarch64) are
# listed so neither ships with a dynamic CRT dependency.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
